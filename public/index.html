<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agreement Chatbot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Agreement Intake</h1>
        <div class="status-card">
          <div class="label">Application</div>
          <div class="value" id="application-id">Not started</div>
        </div>
        <div class="status-card">
          <div class="label">Progress</div>
          <div class="value" id="progress-text">0 / 4 complete</div>
        </div>
        <div class="status-card">
          <div class="label">Current status</div>
          <div class="value" id="application-status">In progress</div>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <h2>Agreement Walkthrough</h2>
        </header>

        <div class="chat-window" id="chat-window" aria-live="polite">
          <div class="message bot">
            Hello. I can guide you through the agreement step by step. I can explain each section, answer clarification questions, and save your progress.
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input
            id="message-input"
            type="text"
            placeholder="Type your answer or ask a question..."
            autocomplete="off"
            aria-label="Message input"
            required
          />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
